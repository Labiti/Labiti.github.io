name: Sync main → staging

on:
  push:
    branches: [main]

jobs:
  sync-staging:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push main to staging
        run: |
          git checkout -B staging origin/main
          git push origin staging --force-with-lease

      - name: Summary
        run: |
          echo "✅ main synced to staging"
          echo "Test at your staging URL, then promote to Updates when ready."