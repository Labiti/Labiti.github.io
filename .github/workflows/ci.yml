name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging, Updates]

jobs:
  validate:
    runs-on: ubuntu-24.04
    continue-on-error: true  # ← don't block on failure
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate HTML
        uses: anishathalye/proof-html@v2
        continue-on-error: true  # ← warnings only
        with:
          directory: .
          enforce_https: false
          ignore_url_re: |
            ^https://github\.com/labiti/ip-management-system
            ^https://github\.com/labiti/vetting-system
            ^https://github\.com/labiti/agent-hub

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true  # ← warnings only
        with:
          args: --no-progress --exclude-mail '**/*.html' '**/*.md'
          fail: false